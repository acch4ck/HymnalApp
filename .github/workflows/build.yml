branches: [ main, master ]
  workflow_dispatch:
 
jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-latest
 
    permissions:
      contents: read
 
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
 
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
 
      - name: Test, lint, and build app
        run: ./gradlew test lint assembleDebug --stacktrace --no-daemon
 
      - name: Prepare installable APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/hymnal-app-installable.apk
 
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hymnal-app-installable-${{ github.run_number }}
          path: artifacts/hymnal-app-installable.apk
          if-no-files-found: error
          retention-days: 30
 
      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 30
